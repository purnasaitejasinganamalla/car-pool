              iconAnchor: [16, 32]
            });

              try {
                let pickLatLng = [19.1230, 72.9080];
                let destLatLng = [19.1330, 72.9150];

                  const data = await resPick.json();
                  if (data && data[0]) {
                    pickLatLng = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                  }

                  const data = await resDest.json();
                  if (data && data[0]) {
                    destLatLng = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                  }
                }
                if (!active) return;
                window.L.marker(pickLatLng, { icon: pickIcon }).addTo(map).bindPopup(`<b>Pickup:</b> ${pickup}`).openPopup();
                window.L.marker(destLatLng, { icon: destIcon }).addTo(map).bindPopup(`<b>Destination:</b> ${destination}`);
                const bounds = window.L.latLngBounds([pickLatLng, destLatLng]);

                window.L.polyline([pickLatLng, destLatLng], { color: '#6366f1', weight: 5, opacity: 0.9, lineJoin: 'round' }).addTo(map);

    const upsertSupabaseCloud = async (table, id, data) => {
      try {
        const resCheck = await fetch(`${SUPABASE_URL}/rest/v1/${table}?_id=eq.${id}&select=_id`, { headers: SUPABASE_HEADERS });
        const exists = await resCheck.json();
        if (exists && exists.length > 0) {
          const { _id, createdAt, ...payload } = data;
          await fetch(`${SUPABASE_URL}/rest/v1/${table}?_id=eq.${id}`, {
            method: 'PATCH',
            headers: SUPABASE_HEADERS,
            body: JSON.stringify(payload)
          });
        } else {
          await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
            method: 'POST',
            headers: SUPABASE_HEADERS,
            body: JSON.stringify(data)
          });
        }
      } catch (e) {
        console.warn(`[Supabase] Failed to upsert ${table}/${id} to cloud:`, e);
      }
    };

        return { ...b, ride, rider };
      }).filter(b => b.ride && b.rider);
      const myHostedRides = ridePosts.filter(p => p.driverId === currentUser._id);

        let targetUser = null;

          if (b._id === bookingId) {
            targetBooking = { ...b, status };

              const ride = ridePosts.find(p => p._id === b.rideId);
              if (ride) {
                targetRide = { ...ride, seatsAvailable: ride.seatsAvailable - b.seatsBooked };
                setRidePosts(posts => posts.map(p => p._id === ride._id ? targetRide : p));

                const fuelCredits = (b.seatsBooked * ride.price) / 100;
                targetUser = { ...currentUser, savedFuelEstimate: Number((currentUser.savedFuelEstimate + fuelCredits).toFixed(1)) };
                setUsers(allUsers => allUsers.map(u => u._id === currentUser._id ? targetUser : u));
              }
              confetti({ particleCount: 60, spread: 40 });
              addNotification({ title: 'Request Accepted', message: 'You approved a join carpool request!' });
            }
            return targetBooking;
          }
          return b;

    function ChatPageUI({ currentUser, messages, setMessages, users, bookings, initialPartnerId }) {
      const [activePartnerId, setActivePartnerId] = useState(null);
      const [text, setText] = useState('');
      const [showCallWarning, setShowCallWarning] = useState(false);
      useLucideRefresh(activePartnerId + showCallWarning);
      // Setup initial partner if redirected
      useEffect(() => {
        if (initialPartnerId) {
          setActivePartnerId(initialPartnerId);
        }
      }, [initialPartnerId]);
      // Compile unique chat rooms
      const chatRooms = {};
      messages.forEach(msg => {
        if (msg.senderId === currentUser._id || msg.receiverId === currentUser._id) {
          const partnerId = msg.senderId === currentUser._id ? msg.receiverId : msg.senderId;
          const partner = users.find(u => u._id === partnerId);
          if (partner) {
            chatRooms[partnerId] = {
              partner,
              lastText: msg.text,
              lastTime: msg.createdAt
            };
          }
        }
      });
      const partnerList = Object.values(chatRooms);
      // Find active partner info
      const activePartner = activePartnerId ? users.find(u => u._id === activePartnerId) : null;
      // Filter messages for current chat
      const activeMessages = messages.filter(m => {
        const c1 = `${currentUser._id}_${activePartnerId}`;
        const c2 = `${activePartnerId}_${currentUser._id}`;
        return m.chatId === c1 || m.chatId === c2;
      });
      const handleSend = (e) => {
        e.preventDefault();
        if (!text.trim() || !activePartnerId) return;
        const newMsg = {
          _id: 'm' + (messages.length + 1),
          chatId: [currentUser._id, activePartnerId].sort().join('_'),
          senderId: currentUser._id,
          receiverId: activePartnerId,
          text,
          createdAt: new Date().toISOString(),
          isSeen: false
        };
        setMessages(prev => [...prev, newMsg]);
        setText('');
      };
      const handleCallCheck = () => {
        // Safe check: call details enabled only if booking accepted
        const hasAccepted = bookings.some(b => {
          if (b.status !== 'Accepted') return false;
          return (b.riderId === currentUser._id && b.rideId.startsWith('p') && ridePosts.find(p => p._id === b.rideId)?.driverId === activePartnerId) || 
                 (b.riderId === activePartnerId && b.rideId.startsWith('p') && ridePosts.find(p => p._id === b.rideId)?.driverId === currentUser._id);
        });
        // For demo visual unlock, we can also unlock if Aarav is active partner
        const isDemoUnlock = activePartnerId === 'u1' || activePartnerId === 'u3';
        if (hasAccepted || isDemoUnlock) {
          window.location.href = `tel:${activePartner.phone}`;
        } else {
          setShowCallWarning(true);
        }
      };
      return (
        <div className="mx-auto max-w-7xl px-4 py-8 h-[calc(100vh-8rem)]">
          <div className="glass-card rounded-3xl border h-full overflow-hidden grid grid-cols-1 md:grid-cols-3">
            
            {/* Left rooms list */}
            <div className="border-r flex flex-col h-full bg-white/40 dark:bg-slate-900/10">
              <div className="p-4 border-b">
                <h3 className="text-xs font-extrabold uppercase tracking-widest text-slate-700 dark:text-slate-200">Inbox Chat</h3>
              </div>
              
              <div className="flex-grow overflow-y-auto p-2 space-y-1">
                {partnerList.length === 0 ? (
                  <p className="text-xs text-slate-400 text-center py-8">Inbox is empty.</p>
                ) : (
                  partnerList.map(item => {
                    const isSelected = activePartnerId === item.partner._id;
                    return (
                      <button
                        key={item.partner._id} onClick={() => setActivePartnerId(item.partner._id)}
                        className={`w-full flex items-center gap-3 p-3.5 rounded-2xl text-left transition-all ${
                          isSelected ? 'bg-brand-500 text-white shadow-md shadow-brand-500/15' : 'hover:bg-slate-100/50'
                        }`}
                      >
                        <img src={item.partner.profilePhoto} className="h-8 w-8 rounded-full bg-slate-100 object-cover" />
                        <div className="flex-grow min-w-0">
                          <h4 className="text-xs font-bold truncate">{item.partner.name}</h4>
                          <p className={`text-[10px] truncate ${isSelected ? 'text-white/80' : 'text-slate-400'}`}>{item.lastText}</p>
                        </div>
                      </button>
                    );
                  })
                )}
              </div>
            </div>
            {/* Right chat panel */}
            <div className="md:col-span-2 flex flex-col h-full">
              {activePartner ? (
                <>
                  {/* Header */}
                  <div className="p-4 border-b flex justify-between items-center bg-white/50 dark:bg-slate-900/40">
                    <div className="flex items-center gap-2">
                      <img src={activePartner.profilePhoto} className="h-8 w-8 rounded-full bg-slate-100" />
                      <div>
                        <h4 className="text-xs font-bold">{activePartner.name}</h4>
                        <span className="text-[9px] text-slate-400 font-semibold">{activePartner.college} Connection</span>
                      </div>
                    </div>
                    <button 
                      onClick={handleCallCheck}
                      className="rounded-xl border p-2 text-brand-500 hover:bg-slate-50 flex items-center gap-1 text-xs font-bold"
                    >
                      <i data-lucide="phone" className="h-4 w-4"></i>
                      <span>Safe Call</span>
                    </button>
                  </div>
                  {/* Messages Feed */}
                  <div className="flex-grow overflow-y-auto p-4 space-y-3">
                    {activeMessages.map(m => {
                      const isMe = m.senderId === currentUser._id;
                      return (
                        <div key={m._id} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[70%] rounded-2xl px-4 py-2.5 text-xs ${
                            isMe ? 'bg-gradient-to-tr from-brand-600 to-brand-500 text-white shadow-md' : 'bg-slate-100 text-slate-800'
                          }`}>
                            <p>{m.text}</p>
                            <span className="text-[8px] opacity-75 block text-right mt-1">
                              {new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  {/* Typing input */}
                  <form onSubmit={handleSend} className="p-4 border-t flex gap-2">
                    <input 
                      type="text" placeholder="Discuss landmarks or schedule details..." value={text} onChange={e => setText(e.target.value)}
                      className="flex-grow px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white/50 outline-none dark:text-white"
                    />
                    <button type="submit" className="p-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white"><i data-lucide="send" className="h-4 w-4"></i></button>
                  </form>
                </>
              ) : (
                <div className="flex flex-col items-center justify-center text-center p-8 h-full">
                  <span className="text-3xl block mb-1">💬</span>
                  <p className="text-xs font-bold text-slate-400 uppercase">Select active carpool inbox</p>
                </div>
              )}
            </div>
          </div>
          {/* Safe calling details modal */}
          {showCallWarning && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 border max-w-sm w-full text-center shadow-2xl relative">
                <span className="flex h-12 w-12 items-center justify-center rounded-2xl bg-yellow-50 text-yellow-600 mx-auto mb-3">
                  <i data-lucide="shield-check" className="h-6 w-6"></i>
                </span>
                <h3 className="text-sm font-extrabold text-slate-800 dark:text-slate-100">Safe Calling Check</h3>
                <p className="text-xs text-slate-500 mt-2">
                  Classmate phone numbers are kept locked for anti-spam safety until a booking request is officially approved.
                </p>
                <button onClick={() => setShowCallWarning(false)} className="w-full py-2.5 bg-brand-500 text-white text-xs font-bold rounded-xl shadow-md mt-4">Understood</button>
              </div>
            </div>
          )}
        </div>
      );
    }

      const [vehicleType, setVehicleType] = useState(currentUser?.vehicleDetails?.type || 'None');
      const [vehicleModel, setVehicleModel] = useState(currentUser?.vehicleDetails?.model || '');
      const [vehicleNumber, setVehicleNumber] = useState(currentUser?.vehicleDetails?.number || '');
      useLucideRefresh(vehicleType);
      const handleSave = (e) => {
        e.preventDefault();
        const updatedUser = {
          ...currentUser,
          name, phone, instagramId, emergencyContact,
          vehicleDetails: { type: vehicleType, model: vehicleModel, number: vehicleNumber }
        };
        setCurrentUser(updatedUser);
        setUsers(prev => prev.map(u => u._id === currentUser._id ? updatedUser : u));
        upsertSupabaseCloud('users', currentUser._id, updatedUser);
        
        addNotification({ title: 'Profile Updated', message: 'Details saved successfully!' });
        alert('Student profile changes saved successfully!');
      };
      return (
        <div className="mx-auto max-w-4xl px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
          <div>
            <div className="glass-card rounded-3xl p-6 border text-center relative overflow-hidden">
              <div className="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-brand-500 to-emerald-500"></div>
              <img src={currentUser.profilePhoto} className="h-20 w-20 rounded-full border bg-slate-100 mx-auto mb-3 shadow-md" />
              <h3 className="text-sm font-extrabold text-slate-800 dark:text-slate-100">{currentUser.name}</h3>
              <p className="text-[10px] text-slate-400 mt-0.5">{currentUser.college}</p>
              
              <div className="mt-4 border-t pt-4 text-left space-y-2 text-xs text-slate-500">
                <p>📧 {currentUser.email}</p>
                <p>📞 {currentUser.phone}</p>
                {currentUser.instagramId && <p>📸 {currentUser.instagramId}</p>}
              </div>
            </div>
          </div>
          <div className="md:col-span-2">
            <div className="glass-card rounded-3xl p-6 border">
              <h3 className="text-xs font-extrabold text-slate-700 dark:text-slate-200 uppercase tracking-widest border-b pb-2 mb-4">Edit Student Details</h3>
              
              <form onSubmit={handleSave} className="space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold text-slate-450 uppercase mb-1">Full Name</label>
                    <input 
                      type="text" required value={name} onChange={e => setName(e.target.value)}
                      className="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white/50 outline-none dark:text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-slate-450 uppercase mb-1">Phone Contact</label>
                    <input 
                      type="tel" required value={phone} onChange={e => setPhone(e.target.value)}
                      className="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white/50 outline-none dark:text-white"
                    />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold text-slate-450 uppercase mb-1">Emergency contact</label>
                    <input 
                      type="text" required value={emergencyContact} onChange={e => setEmergencyContact(e.target.value)} placeholder="+91 99999 88888"
                      className="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white/50 outline-none dark:text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-slate-455 uppercase mb-1">Instagram Username</label>
                    <div className="relative">
                      <span className="absolute left-3 top-2 text-xs font-bold text-slate-400">@</span>
                      <input 
                        type="text" value={instagramId} onChange={e => setInstagramId(e.target.value.replace(/^@/, ''))} placeholder="username"
                        className="w-full pl-6 pr-3 py-2 text-xs rounded-xl border border-slate-200 bg-white/50 outline-none dark:text-white"
                      />
                    </div>
                  </div>
                </div>
                <div className="border-t pt-3">
                  <label className="block text-[10px] font-bold text-slate-500 uppercase mb-2">My Commuter Vehicle</label>
                  <div className="grid grid-cols-3 gap-2 mb-2">
                    {['None', 'Bike', 'Car'].map(t => (
                      <button
                        key={t} type="button" onClick={() => setVehicleType(t)}
                        className={`py-1 text-xs font-bold rounded-lg border transition-all ${vehicleType === t ? 'border-brand-500 bg-brand-50 text-brand-600' : 'border-slate-200'}`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                  {vehicleType !== 'None' && (
                    <div className="grid grid-cols-2 gap-3 mt-2">
                      <input 
                        type="text" placeholder="Model e.g. Royal Enfield" required value={vehicleModel} onChange={e => setVehicleModel(e.target.value)}
                        className="w-full px-3 py-2 text-xs rounded-xl border bg-white/50 outline-none"
                      />
                      <input 
                        type="text" placeholder="License Plate No." required value={vehicleNumber} onChange={e => setVehicleNumber(e.target.value)}
                        className="w-full px-3 py-2 text-xs rounded-xl border bg-white/50 outline-none"
                      />
                    </div>
                  )}
                </div>
                <button type="submit" className="w-full py-2.5 bg-gradient-to-tr from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-md mt-4">Save Changes</button>
              </form>
            </div>
          </div>
        </div>
      );
    }
    // ----------------------------------------------------
    // PAGE UI: ADMIN PANEL
    // ----------------------------------------------------
    function AdminPanelUI({ currentUser, users, setUsers, colleges, setColleges }) {
      const [newColName, setNewColName] = useState('');
      useLucideRefresh(true);
      const handleAddColSubmit = (e) => {
        e.preventDefault();
        if (!newColName.trim()) return;
        setColleges(prev => [...prev, { name: newColName }]);
        setNewColName('');
      };
      const handleVerifyToggle = (uId, current) => {
        setUsers(prev => prev.map(u => {
          if (u._id === uId) return { ...u, isVerified: !current };
          return u;
        }));
      };
      const handleBanToggle = (uId, current) => {
        setUsers(prev => prev.map(u => {
          if (u._id === uId) return { ...u, isBanned: !current };
          return u;
        }));
      };
      return (
        <div className="mx-auto max-w-7xl px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
          {/* Add Campus colleges */}
          <div>
            <div className="glass-card rounded-3xl p-5 border space-y-4">
              <h3 className="text-xs font-extrabold text-slate-700 dark:text-slate-200 uppercase tracking-widest border-b pb-2">Register Campus Zone</h3>
              
              <form onSubmit={handleAddColSubmit} className="space-y-3">
                <input 
                  type="text" required value={newColName} onChange={e => setNewColName(e.target.value)} placeholder="University Campus Name"
                  className="w-full px-3 py-2 text-xs rounded-xl border outline-none bg-white/50"
                />
                <button type="submit" className="w-full py-2 bg-brand-500 hover:bg-brand-600 text-white font-bold text-xs rounded-xl shadow-md flex items-center justify-center gap-1">
                  <i data-lucide="plus" className="h-3.5 w-3.5"></i> Add Campus
                </button>
              </form>
              <div className="border-t pt-3">
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Campus Zone List</label>
                <div className="space-y-1.5 max-h-52 overflow-y-auto">
                  {colleges.map((c, i) => (
                    <div key={i} className="flex justify-between items-center text-xs font-semibold bg-slate-50 dark:bg-slate-900/50 p-2 rounded-lg border">
                      <span>{c.name}</span>
                      <span className="text-[9px] font-bold text-emerald-500">Active</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
          {/* Students control list table */}
          <div className="lg:col-span-2">
            <div className="glass-card rounded-3xl p-5 border">
              <h3 className="text-xs font-extrabold text-slate-700 dark:text-slate-200 uppercase tracking-widest border-b pb-2 mb-3">Student Accounts Moderation</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="border-b font-bold text-[9px] uppercase tracking-wider text-slate-400">
                      <th className="py-2">Student Info</th>
                      <th className="py-2">College Campus</th>
                      <th className="py-2">Verification</th>
                      <th className="py-2 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {users.map(u => (
                      <tr key={u._id} className="border-b last:border-0 hover:bg-slate-50/50">
                        <td className="py-3 flex items-center gap-2">
                          <img src={u.profilePhoto} className="h-7 w-7 rounded-full bg-slate-100" />
                          <div>
                            <p className="font-bold">{u.name}</p>
                            <p className="text-[9px] text-slate-400">{u.email}</p>
                          </div>
                        </td>
                        <td className="py-3 font-semibold text-slate-500">{u.college}</td>
                        <td className="py-3">
                          <span className={`px-2 py-0.5 rounded text-[8px] font-bold ${u.isVerified ? 'bg-emerald-50 text-emerald-600' : 'bg-yellow-50 text-yellow-600'}`}>
                            {u.isVerified ? 'Verified' : 'Pending'}
                          </span>
                        </td>
                        <td className="py-3 text-right">
                          <div className="flex justify-end gap-1.5">
                            <button 
                              onClick={() => handleVerifyToggle(u._id, u.isVerified)}
                              className="px-2 py-1 text-[9px] font-bold border rounded-lg hover:bg-slate-50 bg-white"
                            >
                              {u.isVerified ? 'Revoke' : 'Verify'}
                            </button>
                            <button 
                              onClick={() => handleBanToggle(u._id, u.isBanned)}
                              className={`px-2 py-1 text-[9px] font-bold border rounded-lg hover:bg-red-50 hover:text-red-500 ${
                                u.isBanned ? 'bg-red-50 text-red-500' : 'bg-white'
                              }`}
                            >
                              {u.isBanned ? 'Banned' : 'Ban'}
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }
    // Render React root
    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</body>
</html>
