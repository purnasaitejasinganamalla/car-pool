// ─── LocalStorage helpers ─────────────────────────────────────
function initStorage() {
  const ver = localStorage.getItem('cr_version');
  if (ver !== DATA_VERSION) {
    ['cr_users','cr_rides','cr_bookings'].forEach(k => localStorage.removeItem(k));
    localStorage.setItem('cr_version', DATA_VERSION);
  }
  if (!localStorage.getItem('cr_users')) {
    localStorage.setItem('cr_users', JSON.stringify(DEMO_USERS));
  }
  if (!localStorage.getItem('cr_rides')) {
    localStorage.setItem('cr_rides', JSON.stringify(DEMO_RIDES));
  }
  if (!localStorage.getItem('cr_bookings')) {
    localStorage.setItem('cr_bookings', JSON.stringify([]));
  }
}

function getUsers() { return JSON.parse(localStorage.getItem('cr_users') || '[]'); }
function getRides() { return JSON.parse(localStorage.getItem('cr_rides') || '[]'); }
function getBookings() { return JSON.parse(localStorage.getItem('cr_bookings') || '[]'); }
function saveRides(rides) { localStorage.setItem('cr_rides', JSON.stringify(rides)); }
function saveBookings(bookings) { localStorage.setItem('cr_bookings', JSON.stringify(bookings)); }

// ─── Supabase helper ──────────────────────────────────────────
async function supabaseInsert(table, data) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(data)
    });
  } catch(e) { /* offline – localStorage is source of truth */ }
}

// ─── Icon helper ──────────────────────────────────────────────
function Icon({ name, size=18, className='' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      ref.current.appendChild(el);
      window.lucide.createIcons({ nodes: [el] });
    }
  }, [name, size]);
  return <span ref={ref} className={'inline-flex items-center justify-center ' + className}/>;
}

function Avatar({ initials, size=40, idx=0 }) {
  const grad = AVATAR_COLORS[idx % AVATAR_COLORS.length];
  return (
    <div className={`rounded-full flex items-center justify-center font-bold text-white bg-gradient-to-br ${grad} shrink-0`}
      style={{ width: size, height: size, fontSize: size * 0.38 }}>

    </div>
  );
}

// ─── Toast ────────────────────────────────────────────────────
function Toast({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  const bg = type === 'error' ? 'bg-red-500/90' : type === 'warn' ? 'bg-yellow-500/90' : 'bg-emerald-500/90';
  return (
    <div className={`fixed top-4 right-4 z-50 ${bg} text-white px-5 py-3 rounded-xl shadow-xl fade-in flex items-center gap-3 max-w-xs`}>
      <Icon name={type==='error'?'x-circle':type==='warn'?'alert-triangle':'check-circle'} size={18}/>
      <span className="text-sm font-medium">{msg}</span>
      <button onClick={onClose} className="ml-2 opacity-70 hover:opacity-100"><Icon name="x" size={14}/></button>
    </div>
  );
}

      setLoading(false);

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">

// ─── RideCard ─────────────────────────────────────────────────
function RideCard({ ride, currentUser, onBook }) {
  const [booked, setBooked] = useState(false);
  const [showContact, setShowContact] = useState(false);

  useEffect(() => {
    if (currentUser) {
      const bookings = getBookings();
      setBooked(bookings.some(b => b.rideId === ride.id && b.userId === currentUser.id));
    }
  }, []);

  function handleBook() {
    if (!currentUser) return;
    const bookings = getBookings();
    if (bookings.some(b => b.rideId === ride.id && b.userId === currentUser.id)) return;
    const booking = { id: 'b_' + Date.now(), rideId: ride.id, userId: currentUser.id, bookedAt: new Date().toISOString() };
    const updated = [...bookings, booking];
    saveBookings(updated);
    supabaseInsert('bookings', { ride_id: ride.id, user_id: currentUser.id });
    setBooked(true);
    if (onBook) onBook();
  }

  const isOwn = currentUser && ride.userId === currentUser.id;
  const avatarIdx = DEMO_USERS.findIndex(u => u.id === ride.userId);

  return (
    <div className="glass rounded-2xl p-4 card-hover fade-in">
      <div className="flex items-start gap-3 mb-3">
        <Avatar initials={ride.driverAvatar || ride.driverName?.slice(0,2)} size={44} idx={avatarIdx >= 0 ? avatarIdx : 0}/>
        <div className="flex-1 min-w-0">
          <div className="flex items-center justify-between gap-2">
            <h3 className="font-bold text-base text-slate-100 truncate">{ride.driverName}</h3>
            <span className="tag bg-blue-500/20 text-blue-400 shrink-0">
              {ride.seats} seat{ride.seats !== 1 ? 's' : ''}
            </span>
          </div>
          <p className="text-xs text-slate-400 truncate">{ride.college}</p>
        </div>
      </div>

      <div className="space-y-2 mb-3">
        <div className="flex items-center gap-2 text-sm">
          <span className="w-5 h-5 rounded-full bg-emerald-500/20 flex items-center justify-center shrink-0">
            <Icon name="map-pin" size={11} className="text-emerald-400"/>
          </span>
          <span className="text-slate-300 truncate">{ride.pickup}</span>
        </div>
        <div className="flex items-center gap-2 text-sm">
          <span className="w-5 h-5 rounded-full bg-blue-500/20 flex items-center justify-center shrink-0">
            <Icon name="flag" size={11} className="text-blue-400"/>
          </span>
          <span className="text-slate-300 truncate">{ride.destination}</span>
        </div>
        {ride.route && (
          <div className="flex items-center gap-2 text-xs">
            <span className="w-5 h-5 rounded-full bg-purple-500/20 flex items-center justify-center shrink-0">
              <Icon name="route" size={11} className="text-purple-400"/>
            </span>
            <span className="text-slate-500 truncate">{ride.route}</span>
          </div>
        )}
      </div>

      <div className="flex flex-wrap gap-2 mb-3">
        <span className="tag bg-slate-700 text-slate-300">
          <Icon name="clock" size={11} className="mr-1"/> {ride.time}
        </span>
        <span className="tag bg-emerald-500/20 text-emerald-400 font-bold">
          ₹{ride.price}
        </span>
        {ride.gender && ride.gender !== 'Any' && (
          <span className="tag bg-pink-500/20 text-pink-400">
            <Icon name="user" size={11} className="mr-1"/> {ride.gender} only
          </span>
        )}
        <span className="tag bg-indigo-500/20 text-indigo-400">
          <Icon name={ride.vehicleType === 'Bike' ? 'bike' : 'car'} size={11} className="mr-1"/>
          {ride.vehicleModel || ride.vehicleType}
        </span>
      </div>

      {ride.vehicleImg && (
        <div className="mb-3 rounded-xl overflow-hidden h-28 bg-slate-800">
          <img src={ride.vehicleImg} alt="Vehicle" className="w-full h-full object-cover"/>
        </div>
      )}

      <div className="border-t border-slate-700/50 pt-3 flex items-center justify-between gap-2">
        <button onClick={() => setShowContact(!showContact)}
          className="btn-secondary text-xs px-3 py-2 rounded-lg flex items-center gap-1.5">
          <Icon name="phone" size={13}/> Contact
        </button>
        {!isOwn && (
          <button onClick={handleBook} disabled={booked}
            className={`text-xs px-4 py-2 rounded-lg font-semibold flex items-center gap-1.5 transition-all ${booked ? 'bg-emerald-500/20 text-emerald-400 cursor-default' : 'btn-primary text-white'}`}>
            {booked ? <><Icon name="check" size={13}/> Joined</> : <><Icon name="plus" size={13}/> Join Ride</>}
          </button>
        )}
        {isOwn && <span className="tag bg-yellow-500/20 text-yellow-400 text-xs">Your Ride</span>}
      </div>

      {showContact && (
        <div className="mt-3 p-3 glass-light rounded-xl space-y-1.5 fade-in">
          {ride.phone && (
            <div className="flex items-center gap-2 text-sm">
              <Icon name="phone" size={14} className="text-emerald-400"/>
              <span className="text-slate-300">{ride.phone}</span>
            </div>
          )}
          {ride.instagram && (
            <div className="flex items-center gap-2 text-sm">
              <Icon name="instagram" size={14} className="text-pink-400"/>
              <span className="text-slate-300">{ride.instagram}</span>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── Map Component ────────────────────────────────────────────
function RideMap({ pickup, destination }) {
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const markersRef = useRef([]);
  const polylineRef = useRef(null);
  const debounceRef = useRef(null);
  const [loading, setLoading] = useState(false);
  const [distance, setDistance] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => {
    if (!mapInstanceRef.current && mapRef.current) {
      mapInstanceRef.current = L.map(mapRef.current, { zoomControl: true }).setView([20.5937, 78.9629], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(mapInstanceRef.current);
    }
    return () => { if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; } };
  }, []);

  useEffect(() => {
    if (debounceRef.current) clearTimeout(debounceRef.current);
    if (!pickup && !destination) return;
    debounceRef.current = setTimeout(() => geocodeAndDraw(), 800);
    return () => clearTimeout(debounceRef.current);
  }, [pickup, destination]);

  async function geocode(query) {
    const url = `https://us1.locationiq.com/v1/search?key=${LIQ_KEY}&q=${encodeURIComponent(query)}&format=json&limit=1&countrycodes=in`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Geocode failed');
    const data = await res.json();
    if (!data || data.length === 0) throw new Error('Not found');
    return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
  }

  function haversine([lat1, lon1], [lat2, lon2]) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  async function geocodeAndDraw() {
    if (!mapInstanceRef.current) return;
    setLoading(true);
    setError('');
    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];
    if (polylineRef.current) { polylineRef.current.remove(); polylineRef.current = null; }

    try {
      const coords = [];
      if (pickup) {
        const c = await geocode(pickup);
        const redIcon = L.divIcon({ className:'', html:`<div style="width:22px;height:22px;background:#ef4444;border-radius:50% 50% 50% 0;border:2px solid white;transform:rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,0.4)"></div>`, iconSize:[22,22], iconAnchor:[11,22] });
        const m = L.marker(c, { icon: redIcon }).addTo(mapInstanceRef.current).bindPopup(`<b>Pickup:</b> ${pickup}`);
        markersRef.current.push(m);
        coords.push(c);
      }
      if (destination) {
        const c = await geocode(destination);
        const greenIcon = L.divIcon({ className:'', html:`<div style="width:22px;height:22px;background:#22c55e;border-radius:50% 50% 50% 0;border:2px solid white;transform:rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,0.4)"></div>`, iconSize:[22,22], iconAnchor:[11,22] });
        const m = L.marker(c, { icon: greenIcon }).addTo(mapInstanceRef.current).bindPopup(`<b>Destination:</b> ${destination}`);
        markersRef.current.push(m);
        coords.push(c);
      }
      if (coords.length === 2) {
        polylineRef.current = L.polyline(coords, { color:'#3b82f6', weight:4, opacity:0.8, dashArray:'8,6' }).addTo(mapInstanceRef.current);
        const d = haversine(coords[0], coords[1]);
        setDistance(d.toFixed(1));
        mapInstanceRef.current.fitBounds(L.latLngBounds(coords), { padding:[30,30] });
      } else if (coords.length === 1) {
        mapInstanceRef.current.setView(coords[0], 13);
      }
    } catch(e) {
      setError('Could not geocode location');
    }
    setLoading(false);
  }

  return (
    <div className="relative">
      <div ref={mapRef} id="map"/>
      {loading && (
        <div className="absolute inset-0 flex items-center justify-center bg-slate-900/60 rounded-xl z-10">
          <div className="flex items-center gap-2 text-blue-400">
            <Icon name="loader-2" size={20} className="animate-spin"/>
            <span className="text-sm">Finding route...</span>
          </div>
        </div>
      )}
      {distance && !loading && (
        <div className="absolute bottom-3 left-3 z-10 bg-slate-900/90 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 border border-slate-700">
          <Icon name="route" size={12} className="text-blue-400"/>
          ~{distance} km
        </div>
      )}
      {error && <p className="text-xs text-red-400 mt-1">{error}</p>}
    </div>
  );
}

function PostRideTab({ currentUser, toast }) {
  const [form, setForm] = useState({
    pickup:'', destination:'', landmark:'', route:'',
    time:'', seats:1, price:'', gender:'Any',
    vehicleType:'', vehicleModel:'', vehicleImg:null,
    phone:'', instagram:'',
    schedule:'Today'
  });
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const fileRef = useRef(null);

  function upd(k, v) { setForm(f => ({ ...f, [k]: v })); }

  function handleFileChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => upd('vehicleImg', ev.target.result);
    reader.readAsDataURL(file);
  }

  function getDate() {
    if (form.schedule === 'Today') return getTodayStr();
    if (form.schedule === 'Tomorrow') return getTomorrowStr();
    return getTodayStr();
  }

  function submit(e) {
    e.preventDefault();
    if (!form.pickup || !form.destination || !form.time || !form.price) {
      toast('Please fill in all required fields', 'error'); return;
    }
    if (!form.vehicleType) { toast('Please select a vehicle type', 'error'); return; }
    if (!form.vehicleModel) { toast('Please enter your vehicle model', 'error'); return; }
    if (!form.phone && !form.instagram) { toast('Please provide at least one contact method', 'error'); return; }

    setTimeout(() => {
      const ride = {
        id: 'r_' + Date.now(),

        <div className="space-y-3 fade-in">
          {myBookings.length === 0 ? (
            <div className="glass rounded-2xl p-8 text-center">
              <Icon name="ticket" size={40} className="text-slate-600 mx-auto mb-3"/>
              <p className="text-slate-400 font-medium">No bookings yet</p>
              <p className="text-slate-500 text-sm mt-1">Find a ride and join it</p>
            </div>
          ) : myBookings.map(r => r && (
            <div key={r.id} className="glass rounded-2xl p-4 fade-in">
              <div className="flex items-start gap-3">
                <Avatar initials={r.driverAvatar} size={40} idx={DEMO_USERS.findIndex(u => u.id === r.userId)}/>
                <div className="flex-1 min-w-0">
                  <p className="font-semibold text-sm text-slate-200">{r.driverName}</p>
                  <p className="text-xs text-slate-400">{r.pickup} → {r.destination}</p>
                  <div className="flex gap-2 mt-2">
                    <span className="tag bg-slate-700 text-slate-300 text-xs">{r.time}</span>
                    <span className="tag bg-emerald-500/20 text-emerald-400 text-xs">₹{r.price}</span>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Profile Tab ──────────────────────────────────────────────
function ProfileTab({ currentUser, onLogout }) {
  const users = getUsers();
  const user = users.find(u => u.id === currentUser.id) || currentUser;
  const myRidesCount = getRides().filter(r => r.userId === user.id).length;
  const myBookingsCount = getBookings().filter(b => b.userId === user.id).length;

  return (
    <div className="space-y-4">
      <div>
        <h2 className="text-xl font-bold text-slate-100 mb-1">Profile</h2>
        <p className="text-sm text-slate-400">Your account details</p>
      </div>

      <div className="glass rounded-2xl p-6 text-center">
        <div className="flex justify-center mb-3">
          <Avatar initials={user.avatar} size={72} idx={DEMO_USERS.findIndex(u => u.id === user.id)}/>
        </div>
        <h3 className="text-xl font-bold text-slate-100">{user.name}</h3>
        <p className="text-sm text-slate-400 mt-0.5">{user.email}</p>
        <div className="mt-3 flex justify-center">
          <span className="tag bg-blue-500/20 text-blue-400 text-xs">
            <Icon name="graduation-cap" size={12} className="mr-1"/> {user.college}
          </span>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div className="glass rounded-xl p-4 text-center">
          <p className="text-2xl font-bold text-blue-400">{myRidesCount}</p>
          <p className="text-xs text-slate-500 mt-0.5">Rides Posted</p>
        </div>
        <div className="glass rounded-xl p-4 text-center">
          <p className="text-2xl font-bold text-emerald-400">{myBookingsCount}</p>
          <p className="text-xs text-slate-500 mt-0.5">Rides Joined</p>
        </div>
      </div>

      {user.vehicle && (
        <div className="glass rounded-xl p-4 flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center">
            <Icon name={user.vehicle === 'Bike' ? 'bike' : 'car'} size={20} className="text-blue-400"/>
          </div>
          <div>
            <p className="text-xs text-slate-400">Vehicle</p>
            <p className="text-sm font-semibold text-slate-200">{user.vehicle} – {user.model}</p>
          </div>
        </div>
      )}

      <div className="glass rounded-xl p-4 space-y-3">
        <h4 className="text-sm font-semibold text-slate-300">About CampusRide</h4>
        <p className="text-xs text-slate-500 leading-relaxed">
          CampusRide connects students for safe, affordable campus commutes.
          Share rides, save money, and reduce your carbon footprint.
        </p>
      </div>

      <button onClick={onLogout}
        className="w-full py-3 rounded-xl border border-red-500/30 text-red-400 hover:bg-red-500/10 transition-all font-semibold text-sm flex items-center justify-center gap-2">
        <Icon name="log-out" size={16}/> Log Out
      </button>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────
function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [tab, setTab] = useState('dashboard');
  const [toastData, setToastData] = useState(null);

  useEffect(() => {
    initStorage();
    const saved = localStorage.getItem('cr_current_user');
    if (saved) { try { setCurrentUser(JSON.parse(saved)); } catch(e) {} }
  }, []);

  function handleLogin(user) {
    setCurrentUser(user);
    localStorage.setItem('cr_current_user', JSON.stringify(user));
  }

  function handleLogout() {
    setCurrentUser(null);
    localStorage.removeItem('cr_current_user');
    setTab('dashboard');
  }

  function toast(msg, type='success') {
    setToastData({ msg, type, key: Date.now() });
  }

  if (!currentUser) return <AuthScreen onLogin={handleLogin}/>;

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
      {/* Header */}
      <header className="glass sticky top-0 z-40 px-4 py-3 border-b border-slate-700/50">
        <div className="max-w-lg mx-auto flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center">
              <Icon name="car" size={16} className="text-white"/>
            </div>
            <span className="font-bold text-base gradient-text">CampusRide</span>
          </div>
          <div className="flex items-center gap-2">
            <span className="text-xs text-slate-400 hidden sm:block">{currentUser.name}</span>
            <button onClick={() => setTab('profile')} className="p-1.5 rounded-xl hover:bg-slate-700/50 transition-colors">
              <Avatar initials={currentUser.avatar} size={30} idx={DEMO_USERS.findIndex(u => u.id === currentUser.id)}/>
            </button>
          </div>
        </div>
      </header>

      {/* Main content */}
      <main className="max-w-lg mx-auto px-4 pt-4 pb-28">
        {tab === 'dashboard' && <DashboardTab currentUser={currentUser} toast={toast}/>}
        {tab === 'find' && <FindRideTab currentUser={currentUser} toast={toast}/>}
        {tab === 'post' && <PostRideTab currentUser={currentUser} toast={toast}/>}
        {tab === 'profile' && <ProfileTab currentUser={currentUser} onLogout={handleLogout}/>}
      </main>

      <BottomNav tab={tab} setTab={setTab}/>

      {toastData && <Toast key={toastData.key} msg={toastData.msg} type={toastData.type} onClose={() => setToastData(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
